name: abadar

services:
  # Stores durable users, orders, and immutable trade history.
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-abadar}
      POSTGRES_USER: ${POSTGRES_USER:-abadar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-abadar_dev}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks:
      - abadar

  # Hosts the authenticated API, matching engine, persistence, and recovery flow.
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      PORT: "8080"
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:3000}
      APP_VERSION: local
      DATABASE_CONNECTION_STRING: Host=postgres;Port=5432;Database=${POSTGRES_DB:-abadar};Username=${POSTGRES_USER:-abadar};Password=${POSTGRES_PASSWORD:-abadar_dev}
      JWT_ISSUER: ${JWT_ISSUER:-abadar-backend}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-abadar-web}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-abadar-development-signing-key-change-before-production-2026}
      JWT_LIFETIME_MINUTES: ${JWT_LIFETIME_MINUTES:-60}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/api/v1/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - abadar

  # Hosts the Next.js user and administrator workspaces.
  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      BACKEND_URL: http://backend:8080
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - abadar

networks:
  # Isolates internal service discovery from unrelated Docker workloads.
  abadar:
    driver: bridge

volumes:
  # Preserves PostgreSQL state across container recreation.
  postgres-data:
